x-coverage:
  state: blocked
  reason: bot-challenge
  detail: >-
    Every customer-facing hyatt.com host (www, about, world) sits behind an Akamai bot
    challenge that answers HTTP 403 with Hyatt's own branded multilingual interstitial and
    error code E6020 for EVERY path — the homepage and /robots.txt included — and escalates
    to HTTP 429 when sent a full browser header set, so not one page of Hyatt's own site
    could be read to confirm or rule out a developer program; everything reachable around it
    (apigw.hyatt.com answering bare zero-byte 404s, no developer.* / apis.* / partner*.hyatt.com
    in DNS, 0 public repos in github.com/hyatt, no Hyatt package in npm/PyPI/RubyGems/crates/NuGet)
    points at no public API surface, but that finding is not asserted publicly because the
    authoritative source for it was unreadable.
  evidence:
    - url: https://www.hyatt.com/
      status: 403
