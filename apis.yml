aid: hyatt-hotels
name: Hyatt Hotels
description: >-
  Hyatt Hotels Corporation (NYSE: H) is a Chicago-headquartered global hospitality
  company that develops, owns, operates, manages, franchises and licenses hotels,
  resorts, branded residences and vacation-ownership properties across brands
  including Park Hyatt, Grand Hyatt, Hyatt Regency, Andaz, Alila, Thompson Hotels,
  Hyatt Centric, Hyatt Place, Hyatt House and Miraval. No Hyatt developer portal, API
  reference, machine-readable contract or first-party SDK was found on any reachable
  Hyatt host or in any public registry as of September 2026; api.hyatt.com resolves to
  a live but undocumented gateway, and hyatt.com sits behind an edge bot challenge no
  automated client can read. Partner
  connectivity runs through third parties (Hapi for event streams and transactional
  APIs, Sabre SynXis for reservations), and Hyatt's conversational surface ships as a
  Hyatt-branded app inside ChatGPT rather than an endpoint Hyatt hosts. Hyatt has run
  a public HackerOne bug bounty program since January 2019.
