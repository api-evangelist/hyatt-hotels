  documents_found: 0
  hit_count: 0
  note: >-
    Hyatt Hotels publishes no /.well-known/ discovery document on any host reachable to an
    anonymous client. No security.txt, no OIDC/OAuth discovery, no api-catalog, no
    ai-plugin, no apis.json, no AAuth resource, no A2A agent card. NO WellKnown and NO
    SecurityTxt pointer is wired in apis.yml, because nothing is present — this file
    records the probe, it does not credit a surface.
bot_challenge_warning: >-
  The three customer-facing hyatt.com hosts (www, about, world) are behind an edge bot
  challenge that answers HTTP 403 with a branded multilingual interstitial ("We're sorry.
  Your browser did something unexpected", Hyatt error code E6020, 12,857 bytes) for EVERY
  path including / and /robots.txt. A full browser header set escalates to HTTP 429. These
  403s are our crawler being turned away, not evidence that Hyatt does or does not serve a
  document at these paths; they are recorded as unknown, never as a hit.
